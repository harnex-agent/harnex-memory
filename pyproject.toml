[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnex-memory"
version = "0.1.0"
description = "Memory and skill/rule/hook document management for harnex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
]

[project.scripts]
harnex-memory = "harnex_memory.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
