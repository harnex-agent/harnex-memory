[package]
name = "harnex-memory-gui"
version = "0.1.0"
description = "Desktop GUI for harnex-memory"
authors = ["harnex"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "harnex_memory_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
